<title>Calendário Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a semana é o centro clínico da página; notas, calendário e estudos à esquerda, energia, avisos e dinheiro à direita.
   No celular: notas no topo, semana, depois cards compactos; abas fixas embaixo e "+" flutuante. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --surface-2:#eceff1; --line:#dde2e6; --line-2:#c9d0d5;
  --fg:#12181c; --fg-2:#4f5b64; --fg-3:#84909a;
  --accent:#1c5961; --accent-fg:#ffffff; --accent-soft:#dfeced;
  --good:#1d8150; --bad:#c93636; --warn:#a96d12;
  --s-fix:#2a78d6; --s-sup:#eb6834; --s-inv:#1baf7a; --s-sob:#eda100;
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-b:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(18,28,34,.05), 0 6px 20px rgba(18,28,34,.06);
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1214; --surface:#161b1e; --surface-2:#1e2427; --line:#283035; --line-2:#36414a;
    --fg:#e6ecef; --fg-2:#a2adb5; --fg-3:#6d7881;
    --accent:#86c7cb; --accent-fg:#0b1d1f; --accent-soft:#1b3033;
    --good:#4cc38a; --bad:#f06c6c; --warn:#e2a948;
    --s-fix:#3987e5; --s-sup:#d95926; --s-inv:#199e70; --s-sob:#c98500;
    --shadow:0 1px 0 rgba(255,255,255,.02);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1214; --surface:#161b1e; --surface-2:#1e2427; --line:#283035; --line-2:#36414a;
  --fg:#e6ecef; --fg-2:#a2adb5; --fg-3:#6d7881;
  --accent:#86c7cb; --accent-fg:#0b1d1f; --accent-soft:#1b3033;
  --good:#4cc38a; --bad:#f06c6c; --warn:#e2a948;
  --s-fix:#3987e5; --s-sup:#d95926; --s-inv:#199e70; --s-sob:#c98500;
  --shadow:0 1px 0 rgba(255,255,255,.02);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.small{font-size:13px} .tiny{font-size:12px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--font-d);font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--fg-3);white-space:nowrap}
.sync{font-size:11px;color:var(--fg-3);display:flex;align-items:center;gap:5px;margin-left:auto}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);display:inline-block}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--warn)}
.tabs-top{display:none;gap:4px}
@media (max-width:759px){ .brand span{display:none} .sync span{display:none} }
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

/* Bottom tabs */
.tabs-bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(7,1fr)}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--fg-3)}
.tab svg{width:22px;height:22px}
@media (max-width:420px){.tabs-bot .tab{font-size:10.5px;letter-spacing:-.01em}.tabs-bot .tab svg{width:21px;height:21px}}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:31;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab svg{width:26px;height:26px}

/* Page */
main{max-width:1440px;margin:0 auto;padding-block:14px 8px;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-2);font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.home{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.home .cards{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){ .home .cards{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start} }
@media (min-width:1100px){
  .tabs-bot{display:none} .tabs-top{display:flex}
  body{padding-bottom:24px}
  .fab{bottom:24px;right:24px}
  .home{grid-template-columns:290px minmax(0,1fr) 300px;align-items:start}
  .sync{margin-left:0}
  .top-in .spacer{flex:1}
}
.tabs-top .tab{height:38px;flex-direction:row;padding:0 12px;border-radius:10px;font-size:14px;gap:7px}
.tabs-top .tab svg{width:18px;height:18px}
.tabs-top .tab[aria-current="page"]{background:var(--accent-soft)}
.tabs-top .tab:hover{color:var(--fg)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--fg-2)}
.in{width:100%;min-width:0;height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 11px;font-size:15px}
textarea.in{height:auto;padding:9px 11px;resize:vertical;line-height:1.4}
.in:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 120px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* Notes */
.note-in{display:flex;gap:8px;align-items:flex-end}
.note-in textarea{flex:1;min-height:40px}
.notes-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.note{display:block;width:100%;text-align:left;padding:9px 2px;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{font-size:11.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center;margin-top:2px}
.note .pin{color:var(--accent);display:inline-flex}
.note .pin svg{width:12px;height:12px}

/* Week */
.week{container-type:inline-size;padding:14px 12px}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-inline:2px}
.wk-h h2{font-family:var(--font-d);font-size:22px;letter-spacing:-.015em;font-weight:700}
.wk-h .ab{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;margin-left:8px;vertical-align:3px}
.wk-nav{display:flex;gap:4px;align-items:center}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;padding:8px 2px;border-top:1px solid var(--line);min-height:48px}
.day:first-child{border-top:0}
.dh{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.1;padding-top:2px}
.dh .w{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:700}
.dh .d{font-family:var(--font-d);font-size:20px;font-weight:700}
.day.today .dh .d{color:var(--accent)}
.day.today .dh .w{color:var(--accent)}
.day.past{opacity:.72}
.dh .full{font-size:10px;color:var(--warn);font-weight:700;margin-top:3px}
.items{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-width:0}
.chip{--c:#888;display:flex;align-items:stretch;border-radius:8px;background:color-mix(in srgb,var(--c) 15%,var(--surface));min-width:0;max-width:100%}
.chip .ck{width:26px;display:grid;place-items:center;flex:none}
.chip .ck i{width:13px;height:13px;border-radius:50%;border:2px solid var(--c);display:block}
.chip.done .ck i{background:var(--c)}
.chip .lb{display:flex;align-items:baseline;gap:6px;padding:6px 10px 6px 0;min-width:0;text-align:left;font-size:13.5px;font-weight:600}
.chip.nock .lb{padding-left:10px}
.chip .lb t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .lb em{font-style:normal;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--fg));white-space:nowrap}
.chip.done .lb{text-decoration:line-through;opacity:.6}
.chip.shift{background:var(--c);color:#fff}
.chip.shift .lb em{color:rgba(255,255,255,.88)}
.add-day{height:30px;width:30px;border-radius:8px;color:var(--fg-3);display:grid;place-items:center;border:1px dashed var(--line-2)}
.add-day svg{width:14px;height:14px}
.add-day:hover{color:var(--accent);border-color:var(--accent)}
@container (min-width:640px){
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .day{display:flex;flex-direction:column;border-top:0;border-radius:10px;background:var(--surface-2);padding:8px 6px;min-height:300px;gap:6px}
  .day.today{background:var(--accent-soft)}
  .dh{flex-direction:row;align-items:baseline;gap:6px;padding:0 2px 4px}
  .dh .full{margin:0 0 0 auto}
  .items{flex-direction:column;flex-wrap:nowrap}
  .chip{flex-direction:column;align-items:stretch;position:relative}
  .chip .ck{position:absolute;right:2px;top:2px;width:22px;height:22px}
  .chip .ck i{width:11px;height:11px}
  .chip .lb{flex-direction:column;align-items:flex-start;gap:0;padding:6px 22px 6px 8px;font-size:12.5px;line-height:1.25}
  .chip.nock .lb{padding-left:8px}
  .chip .lb t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chip .lb em{font-size:11px}
  .add-day{width:100%;opacity:0}
  .day:hover .add-day,.add-day:focus-visible{opacity:1}
}

/* Mini calendar */
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mc-h b{font-family:var(--font-d);font-size:16px;text-transform:capitalize}
.mc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.mc .wd{font-size:10.5px;color:var(--fg-3);font-weight:700;padding:3px 0;text-transform:uppercase}
.mc button{height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600}
.mc button:hover{background:var(--surface-2)}
.mc button.out{color:var(--fg-3);font-weight:500}
.mc button.inwk{background:var(--surface-2)}
.mc button.today span{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 5px}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Energy */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:10px;border:1px solid var(--line-2);font-family:var(--font-d);font-size:18px;font-weight:700;background:var(--surface)}
.scale button:hover{border-color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);margin-top:4px}
.e-now{display:flex;align-items:center;justify-content:space-between;gap:10px}
.e-big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1}
.e-big small{font-size:14px;color:var(--fg-3);font-weight:500}
.spark text{fill:var(--fg-3);font-size:10px;font-family:var(--font-b)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600}
.tagb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Notices */
.notice{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.notice:first-child{border-top:0;padding-top:0}
.notice p{margin:0;font-size:14px}
.tip{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.tip b{display:block;font-size:13.5px}
.tip cite{display:block;font-style:normal;font-size:11.5px;color:var(--fg-3);margin-top:3px}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--fg)}
.alert i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.alert.bad i{background:var(--bad)}

/* Lists, kv */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.kv.total{font-weight:700;border-top:1px solid var(--line-2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.lst li:first-child{border-top:0}
.lst .grow{flex:1;min-width:0}
.lst .grow>*{display:block;overflow:hidden;text-overflow:ellipsis}
.lst .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lst button.grow{text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.empty{font-size:13.5px;color:var(--fg-3);padding:6px 0}
.study-t{font-size:14px;font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dchip{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--fg-2)}
.dchip.ok{text-decoration:line-through;opacity:.6}

/* Page headers in tabs */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-family:var(--font-d);font-size:26px;letter-spacing:-.02em}
.ph .sub{font-size:13px;color:var(--fg-2)}
.pager{display:flex;align-items:center;gap:4px}
.pager .lbl{min-width:120px;text-align:center;font-weight:700;font-size:14px;text-transform:capitalize}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .cols{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start} .cols .span2{grid-column:1/-1} }
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--fg-2);font-weight:600}
.stat .v{font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .s{font-size:12px;color:var(--fg-3)}
.prog{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.prog:first-child{border-top:0}
.prog .t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.tbl-w{overflow-x:auto;margin-inline:-2px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:700}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--accent-soft)}
.split{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;margin:6px 0 10px}
.split i{display:block;height:100%}
.split i:first-child{border-radius:4px 0 0 4px}
.split i:last-child{border-radius:0 4px 4px 0}
.sentence{font-size:15px;line-height:1.5;margin:4px 0 0}
.saldo{font-family:var(--font-d);font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.inline-form .field{flex:1 1 110px}
.inline-form .field.w2{flex:2 1 160px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}

/* Energy chart */
.echart text{fill:var(--fg-3);font-size:11px;font-family:var(--font-b)}
.echart .grid{stroke:var(--line);stroke-width:1}
.echart .b{fill:var(--accent)}
.echart .b.low{fill:var(--bad)}
.echart .hit{fill:transparent;cursor:pointer}
.echart .hit:hover+.b,.echart .b.sel{opacity:.75}
.e-read{font-size:13px;color:var(--fg-2);min-height:20px}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffD=(a,b)=>{const A=P(a),B=P(b);return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5)};
const monday=s=>addD(s,-((P(s).getDay()+6)%7));
const ym=s=>s.slice(0,7);
const addM=(m,n)=>{let [y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return `${y}-${pad(mm)}`};
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MOL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=v=>fmtBRL.format(v||0);
const brl0=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0);
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const toMin=t=>{const [a,b]=(t||'0:0').split(':').map(Number);return a*60+(b||0)};
const hm=t=>{if(!t)return '';const [a,b]=t.split(':');return b==='00'?`${+a}h`:`${+a}:${b}`};
const dLabel=s=>{const d=P(s);return `${WD[d.getDay()]} ${d.getDate()}/${pad(d.getMonth()+1)}`};
const dLong=s=>{const d=P(s);return `${WDL[d.getDay()]}, ${d.getDate()} de ${MOL[d.getMonth()]}`};
const mLabel=m=>{const [y,mm]=m.split('-').map(Number);return `${MOL[mm-1]} ${y}`};
const mShort=m=>{const [y,mm]=m.split('-').map(Number);return `${MO[mm-1]}/${String(y).slice(2)}`};
const parseBRL=s=>{s=String(s||'').replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:NaN};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f1=v=>v==null?'–':v.toFixed(1).replace('.',',');
const pct=v=>`${Math.round(v*100)}%`;

const IC={
 week:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 sum:'<path d="M5 20V11M12 20V5M19 20v-6"/>',
 money:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/>',
 energy:'<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
 ai:'<path d="M12 3.5l1.7 4.6 4.6 1.7-4.6 1.7L12 16.1l-1.7-4.6L5.7 9.8l4.6-1.7z"/><path d="M18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 l:'<path d="M15 6l-6 6 6 6"/>', r:'<path d="M9 6l6 6-6 6"/>',
 pin:'<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>',
};
const ico=(n,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- estado ---------- */
const DEF_TYPES={plantao:{n:'Plantão',c:'#e5484d'},estudo:{n:'Estudo',c:'#3b82f6'},academia:{n:'Academia',c:'#f08c2e'},yoga:{n:'Yoga',c:'#30a46c'},pessoal:{n:'Pessoal',c:'#8e4ec6'}};
// Treinos alternam por semana ímpar/par do calendário (numeração ISO, semana começa na segunda).
const SEED_SERIES=[
 {id:'wA1',title:'Academia',type:'academia',time:'18:30',start:'2026-10-05',rule:'odd',skip:[],done:[]},
 {id:'wA2',title:'Yoga',type:'yoga',time:'06:00',start:'2026-10-06',rule:'odd',skip:[],done:[]},
 {id:'wA3',title:'Academia',type:'academia',time:'07:30',start:'2026-10-07',rule:'odd',skip:[],done:[]},
 {id:'wA4',title:'Yoga',type:'yoga',time:'07:00',start:'2026-10-08',rule:'odd',skip:[],done:[]},
 {id:'wB1',title:'Yoga',type:'yoga',time:'06:00',start:'2026-10-12',rule:'even',skip:[],done:[]},
 {id:'wB2',title:'Yoga',type:'yoga',time:'06:00',start:'2026-10-13',rule:'even',skip:[],done:[]},
 {id:'wB3',title:'Academia',type:'academia',time:'07:30',start:'2026-10-14',rule:'even',skip:[],done:[]},
 {id:'wB4',title:'Academia',type:'academia',time:'14:00',start:'2026-10-15',rule:'even',skip:[],done:[]},
];
// Plantões fixos por semana ímpar/par do calendário. Tutora sem horário informado: 7h–19h.
const SEED_RULES=[
 {id:'pA1',par:'odd',start:'2026-10-06',t0:'11:00',t1:'21:00',kind:'porta'},
 {id:'pA2',par:'odd',start:'2026-10-07',t0:'11:00',t1:'21:00',kind:'porta'},
 {id:'pA3',par:'odd',start:'2026-10-09',t0:'07:00',t1:'19:00',kind:'tutora'},
 {id:'pA4',par:'odd',start:'2026-10-10',t0:'07:00',t1:'19:00',kind:'tutora'},
 {id:'pB1',par:'even',start:'2026-10-12',t0:'11:00',t1:'21:00',kind:'porta'},
 {id:'pB2',par:'even',start:'2026-10-13',t0:'11:00',t1:'21:00',kind:'porta'},
 {id:'pB3',par:'even',start:'2026-10-16',t0:'07:00',t1:'19:00',kind:'tutora'},
];
const KEYS=['settings','notes','tasks','series','shifts','money','energy','notices','rules','card','mail'];
const DEF=()=>({
 settings:{types:JSON.parse(JSON.stringify(DEF_TYPES)),rates:{tutora:2200,porta:2000},theme:'system'},
 notes:[],tasks:[],series:JSON.parse(JSON.stringify(SEED_SERIES)),shifts:[],
 money:{exp:[],fixed:[],inv:[],plan:{}},energy:{},notices:[],rules:JSON.parse(JSON.stringify(SEED_RULES)),card:{closeDay:21,entries:[],metas:[],investT:5000,planFrom:'2026-10'},mail:{vip:[],mute:[]}
});
const LS='prontuario-v1';
let S=DEF();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);for(const k of KEYS) if(o[k]!==undefined) S[k]=o[k];}}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let needMig=false;
function fixShape(){
 const d=DEF();
 for(const k of KEYS) if(S[k]==null||typeof S[k]!==typeof d[k]) S[k]=d[k];
 S.settings.types=Object.assign(JSON.parse(JSON.stringify(DEF_TYPES)),S.settings.types||{});
 S.settings.rates=Object.assign({tutora:2200,porta:2000},S.settings.rates||{});
 for(const k of ['exp','fixed','inv']) if(!Array.isArray(S.money[k])) S.money[k]=[];
 for(const k of ['vip','mute'])if(!Array.isArray(S.mail[k]))S.mail[k]=[];
 if(!(S.card.closeDay>=1))S.card.closeDay=21;for(const k of ['entries','metas'])if(!Array.isArray(S.card[k]))S.card[k]=[];if(!(S.card.investT>=0))S.card.investT=5000;if(!S.card.planFrom)S.card.planFrom='2026-10';if(!S.money.plan||typeof S.money.plan!=='object'||Array.isArray(S.money.plan))S.money.plan={};
 let ch=false;
 for(const r of S.series)if(r.wk==='A'||r.wk==='B'){if(r.rule==='biweekly')r.rule=r.wk==='A'?'odd':'even';delete r.wk;ch=true}
 for(const r of S.rules)if(r.wk){r.par=r.wk==='A'?'odd':'even';delete r.wk;r.regen=true;ch=true}
 if(ch)needMig=true;
 return ch;
}
fixShape();

/* ---------- persistência: banco privado por usuário, com reserva no navegador ---------- */
let db=null,uid=null,mode='loading',loaded={},lastRemote={},dirty=new Set(),writing={},saveT=null,booted=false;
function save(...keys){keys.forEach(k=>dirty.add(k));saveLocal();clearTimeout(saveT);saveT=setTimeout(flush,500);render()}
async function flush(){
 if(!db||!uid)return;
 for(const k of [...dirty]){
  if(writing[k]||!loaded[k])continue;
  dirty.delete(k);writing[k]=true;
  const v=JSON.stringify(S[k]);
  try{await db.doc(`data/users/${uid}/${k}`).set({v,at:Date.now()});lastRemote[k]=v;setSync('ok')}
  catch(e){dirty.add(k);if(e&&e.code==='quota_exceeded')toast('Espaço do banco cheio. Exporte um backup e apague itens antigos.');setSync('err')}
  writing[k]=false;
 }
 if(dirty.size){clearTimeout(saveT);saveT=setTimeout(flush,1500)}
}
function mergeVal(remote,local){
 if(Array.isArray(remote)&&Array.isArray(local)){
  const ids=new Set(remote.map(x=>x&&x.id));return remote.concat(local.filter(x=>x&&x.id&&!ids.has(x.id)));
 }
 if(remote&&local&&typeof remote==='object'&&typeof local==='object'){
  const o={...local};for(const k in remote)o[k]=k in local?mergeVal(remote[k],local[k]):remote[k];return o;
 }
 return remote;
}
function setSync(s){
 const el=$('#sync');if(!el)return;
 const map={ok:['ok','salvo na conta'],local:['local','só neste navegador'],err:['local','sem conexão — tentando'],loading:['','carregando']};
 const [c,t]=map[s]||map.loading;el.className='sync '+c;el.lastChild.textContent=t;
}
async function boot(){
 const c=window.claude;
 let fallback=setTimeout(()=>{if(!booted){mode='local';setSync('local');afterLoad()}},9000);
 if(!c||!c.use){clearTimeout(fallback);mode='local';setSync('local');afterLoad();return}
 claudeUse(c);
 let d=null,u=null;
 try{[d,u]=await Promise.all([c.use('db'),c.use('user')])}catch(e){}
 try{uid=u?await u.id():null}catch(e){uid=null}

function isoWeek(ds){const d=P(ds);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const isoPar=ds=>isoWeek(ds)%2?'odd':'even';
const parL=p=>p==='odd'?'ímpar':'par';

function occurs(r,ds){
 if(ds<r.start)return false;if(r.until&&ds>=r.until)return false;if((r.skip||[]).includes(ds))return false;
 const d=diffD(r.start,ds);
 switch(r.rule){case 'daily':return true;case 'weekly':return d%7===0;case 'biweekly':return d%14===0;case 'odd':case 'even':return d%7===0&&isoPar(ds)===r.rule;case 'monthly':return P(ds).getDate()===P(r.start).getDate();default:return d===0}
}
function shiftHours(s){let d=toMin(s.end)-toMin(s.start);if(d<=0)d+=1440;return d/60}
const shiftCross=s=>toMin(s.end)<=toMin(s.start);
const shiftNight=s=>shiftCross(s)||toMin(s.start)>=18*60;
const shiftRate=s=>s.v12!=null?s.v12:(S.settings.rates[s.kind]||0);
const shiftValue=s=>Math.round(shiftHours(s)*shiftRate(s)/12*100)/100;
function shiftEnd(s){const d=P(s.date);if(shiftCross(s))d.setDate(d.getDate()+1);const m=toMin(s.end);d.setHours(Math.floor(m/60),m%60,0,0);return d}
const shiftDone=s=>shiftEnd(s)<new Date();
const kindName=k=>k==='porta'?'Porta':'Tutora';

 out.sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
 return memo['i'+ds]=out;
}

/* ---------- energia: padrões e previsão ---------- */
function eStats(){
 if(memo.es)return memo.es;
 const ent=Object.entries(S.energy).filter(([d,v])=>v&&v.m).sort();
 const all=ent.map(([d,v])=>v.m);
 const overall=mean(all);
 const base=overall??3.5;
 const ad=[],an=[],wd=[[],[],[],[],[],[],[]];
 for(const [d,v] of ent){const p=prevShift(d);if(p==='day')ad.push(v.m);if(p==='night')an.push(v.m);wd[P(d).getDay()].push(v.m)}
 const wdm=wd.map(a=>a.length>=2?mean(a):null);
 const ranked=wdm.map((v,i)=>[v,i]).filter(x=>x[0]!=null).sort((a,b)=>b[0]-a[0]);
 const recent=ent.filter(([d])=>diffD(d,today())<=3&&diffD(d,today())>=0).map(([d,v])=>v.m);
 // conclusão recente de tarefas (histórico)
 const t=today();let done=0;
 for(const x of S.tasks)if(x.done&&x.date<t&&diffD(x.date,t)<=14)done++;
 const moves=S.notices.filter(n=>Date.now()-n.ts<14*864e5).length;
 return memo.es={n:all.length,overall,base,afterDay:mean(ad),nAD:ad.length,afterNight:mean(an),nAN:an.length,
  effDay:ad.length>=2?mean(ad)-base:-0.4,effNight:an.length>=2?mean(an)-base:-1.2,wdm,
  best:ranked.length>=2?ranked[0]:null,worst:ranked.length>=2?ranked[ranked.length-1]:null,recent:mean(recent),done,moves};
}
function predict(ds){
 const k='p'+ds;if(memo[k]!=null)return memo[k];
 const t=today();const e=S.energy[ds];
 if(ds<=t&&e&&e.m)return memo[k]=e.m;
 const st=eStats();let v=st.base;
 const wm=st.wdm[P(ds).getDay()];if(wm!=null)v+=(wm-st.base)*0.6;
 const p=prevShift(ds);if(p==='day')v+=st.effDay;if(p==='night')v+=st.effNight;
 const ahead=diffD(t,ds);if(st.recent!=null&&ahead<=2)v=v*0.65+st.recent*0.35;
 return memo[k]=clamp(v,1,5);
}
function capacity(ds){
 const k='c'+ds;if(memo[k]!=null)return memo[k];
 if(longShiftOn(ds))return memo[k]=0;
 const e=predict(ds);
 let c=e<1.8?0:e<2.6?1:e<3.4?2:e<4.2?3:4;
 if(anyShiftOn(ds))c=Math.min(c,1);
 const st=eStats();const tot=st.done+st.moves;
 if(tot>=5){const r=st.done/tot;if(r<0.6)c=Math.max(e>=3?1:0,c-1);else if(r>0.9&&st.done>=8&&c>0)c=Math.min(5,c+1)}
 const t=today();const te=S.energy[t];
 if(ds===addD(t,1)&&te&&te.m&&te.m<=2)c=Math.min(c,1);
 return memo[k]=c;
}

/* ---------- remanejamento automático ---------- */
function bestDay(start,task,extra){
 let best=null,bs=-1e9;
 for(let i=0;i<14;i++){
  const ds=addD(start,i);const cap=capacity(ds);if(cap<=0)continue;
  const ld=load(ds)+(extra[ds]||0);const free=cap-ld;if(free<=0)continue;
  if(task.type==='estudo'&&studiesOn(ds)+(extra[ds]||0)>=2)continue;
  const s=predict(ds)+free*0.5-i*0.12;if(s>bs){bs=s;best=ds}
 }
 if(best)return best;
 for(let i=1;i<14;i++){const ds=addD(start,i);const cap=capacity(ds);if(cap<=0)continue;const s=predict(ds)-(load(ds)+(extra[ds]||0))/cap;if(s>bs){bs=s;best=ds}}
 return best||addD(start,1);
}
function reschedule(){
 const t=today();
 const over=S.tasks.filter(x=>!x.done&&!x.fixed&&x.date<t).sort((a,b)=>a.date.localeCompare(b.date));
 // limpa avisos antigos já vistos
 const before=S.notices.length;
 S.notices=S.notices.filter(n=>!n.seen||Date.now()-n.ts<60*864e5);
 if(!over.length){if(S.notices.length!==before)save('notices');return}
 memo={};const extra={};
 for(const x of over){
  const to=bestDay(t,x,extra);extra[to]=(extra[to]||0)+1;
  S.notices.push({id:nid(),tid:x.id,from:x.date,to,ts:Date.now()});
  x.orig=x.orig||x.date;x.moved=(x.moved||0)+1;x.date=to;
 }
 save('tasks','notices');
}

function fixedValue(f,m){
 if(f.end&&m>=f.end)return null;
 let v=null;for(const e of [...(f.hist||[])].sort((a,b)=>a.from.localeCompare(b.from)))if(e.from<=m)v=e.v;

function invAskMonth(){const t=today();const m=P(t).getDate()>=25?ym(t):addM(ym(t),-1);if(m<S.card.planFrom||(S.money.plan[m]||{}).st)return null;
 const real=S.money.inv.filter(e=>ym(e.date)===m).reduce((a,e)=>a+e.v,0);return real>=S.card.investT?null:m}

/* ---------- fatura do cartão ---------- */
// ciclo = mês em que a fatura fecha; fecha no dia closeDay (21) e começa no dia seguinte ao fechamento anterior
const daysIn=(y,m)=>new Date(y,m,0).getDate();
function closeDate(cyc){const [y,m]=cyc.split('-').map(Number);return `${cyc}-${pad(Math.min(S.card.closeDay,daysIn(y,m)))}`}
const cycleOf=ds=>ds<=closeDate(ym(ds))?ym(ds):addM(ym(ds),1);
const cycleStart=cyc=>addD(closeDate(addM(cyc,-1)),1);
const cardEntries=cyc=>S.card.entries.filter(e=>e.cyc===cyc).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
// meta variável: renda prevista do mês − gastos fixos − investimento (5 mil, ou o que já foi aportado se for mais)
function cardBudget(cyc){const m=monthMoney(cyc);const inv=m.iv;return {inc:m.inc,fx:m.fx,inv,iv:m.iv,pend:m.ivPending,meta:m.inc>0?Math.max(0,m.inc-m.fx-inv):null}}
const cardMeta=cyc=>cardBudget(cyc).meta;
function cardInfo(cyc){
 const es=cardEntries(cyc),last=es[es.length-1]||null,fin=[...es].reverse().find(e=>e.final)||null;
 const val=fin?fin.v:last?last.v:null,meta=cardMeta(cyc),cd=closeDate(cyc),t=today();
 const left=Math.max(0,diffD(t,cd));let proj=null;
 if(!fin&&es.length>=2){const a=es[0],b=last,dd=diffD(a.date,b.date);if(dd>=3&&b.v>=a.v)proj=b.v+(b.v-a.v)/dd*Math.max(0,diffD(b.date,cd))}
 return {es,last,fin,val,meta,cd,st:cycleStart(cyc),left,proj,gap:meta!=null&&val!=null?meta-val:null};
}
function monthMoney(m){
 const sh=S.shifts.filter(s=>ym(s.date)===m);
 const inc=sh.reduce((a,s)=>a+shiftValue(s),0);
 const incDone=sh.filter(shiftDone).reduce((a,s)=>a+shiftValue(s),0);
 const fixed=S.money.fixed.map(f=>({f,v:fixedValue(f,m)})).filter(x=>x.v!=null);
 const fx=fixed.reduce((a,x)=>a+x.v,0);
 const exp=S.money.exp.filter(e=>ym(e.date)===m);
 const sup=exp.reduce((a,e)=>a+e.v,0);
 const inv=S.money.inv.filter(e=>ym(e.date)===m);
 // aporte mensal planejado (5 mil) conta no mês até ser confirmado no dia 25; "não investi" zera o previsto
 const ivReal=inv.reduce((a,e)=>a+e.v,0);
 const st=(S.money.plan[m]||{}).st;
 const planned=m>=S.card.planFrom&&!st?S.card.investT:0;
 const iv=Math.max(ivReal,planned),ivPending=planned>ivReal;
 const ivTot=S.money.inv.filter(e=>ym(e.date)<=m).reduce((a,e)=>a+e.v,0);
 const hrs=sh.reduce((a,s)=>a+shiftHours(s),0);
 const ce=S.card.entries.filter(e=>e.cyc===m).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
 const cf=[...ce].reverse().find(e=>e.final)||ce[ce.length-1]||null;
 const fat=cf?cf.v:0,fatFinal=!!(cf&&cf.final),fatOk=!!cf;
 return {sh,inc,incDone,fixed,fx,exp,sup,inv,iv,ivReal,ivPending,ivSt:st||null,ivTot,hrs,fat,fatFinal,fatOk,saldo:inc-fx-iv-fat};
}

}

 </div>`;

function eChart(){
 const t=today(),n=30,W=620,H=170,L=22,B=136,top=12,step=(W-L-4)/n,bw=Math.max(6,step-5);
 let s='';
 for(let v=1;v<=5;v++){const y=B-(v/5)*(B-top);s+=`<line class="grid" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`}
 s+=`<line x1="${L}" x2="${W}" y1="${B}" y2="${B}" stroke="var(--line-2)"/>`;
 for(let i=0;i<n;i++){
  const ds=addD(t,i-n+1),e=S.energy[ds],x=L+i*step+(step-bw)/2;
  if(e&&e.m){const bh=e.m/5*(B-top);s+=`<rect class="hit" x="${L+i*step}" y="${top}" width="${step}" height="${B-top}" data-a="eBar" data-ds="${ds}"/><path class="b ${e.m<=2?'low':''}" d="${barPath(x,B-bh,bw,bh)}" pointer-events="none"/>`}
  if(anyShiftOn(ds))s+=`<rect x="${x+bw/2-4}" y="${B+6}" width="8" height="8" rx="2" fill="${T('plantao').c}"/>`;
  if(i%5===4||i===n-1)s+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${P(ds).getDate()}/${pad(P(ds).getMonth()+1)}</text>`;
 }
 return `<div class="tbl-w"><svg class="echart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Energia ao acordar nos últimos 30 dias, com dias de plantão marcados">${s}</svg></div>`;
}

function md(s){
 const lines=h(s).split('\n');let out='',list=null;
 const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');
 const close=()=>{if(list){out+=`</${list}>`;list=null}};
 for(const ln of lines){
  let m;
  if(m=ln.match(/^\s*#{1,4}\s+(.*)/)){close();out+=`<h4>${inl(m[1])}</h4>`}
  else if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`}
  else if(!ln.trim())close();
  else{close();out+=`<p>${inl(ln)}</p>`}
 }
 close();return out;
}

function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
const icsD=(ds,t)=>ds.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');
function fold(l){const o=[];while(l.length>73){o.push(l.slice(0,73));l=' '+l.slice(73)}o.push(l);return o.join('\r\n')}
function buildICS(){
 const now=new Date();const stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Calendario Pessoal//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:Calendário Pessoal'];
 const ev=(uid,sum,ds,t,endDs,endT,extra=[])=>{L.push('BEGIN:VEVENT',`UID:${uid}@prontuario`,`DTSTAMP:${stamp}`,fold('SUMMARY:'+icsEsc(sum)));
  if(t){L.push(`DTSTART:${icsD(ds,t)}`,`DTEND:${icsD(endDs,endT)}`)}else{L.push(`DTSTART;VALUE=DATE:${icsD(ds)}`,`DTEND;VALUE=DATE:${icsD(addD(ds,1))}`)}
  extra.forEach(x=>L.push(fold(x)));L.push('END:VEVENT')};
 const plus1h=(ds,t)=>{const m=toMin(t)+60;return m>=1440?[addD(ds,1),'00:00']:[ds,`${pad(Math.floor(m/60))}:${pad(m%60)}`]};
 const name=x=>x.type==='estudo'?`Estudo – ${x.title}`:x.title;
 for(const x of S.tasks){if(x.time){const [d2,t2]=x.end&&x.end>x.time?[x.date,x.end]:plus1h(x.date,x.time);ev(x.id,name(x),x.date,x.time,d2,t2)}else ev(x.id,name(x),x.date,'')}
 for(const s of S.shifts)ev(s.id,`Plantão ${kindName(s.kind)}`,s.date,s.start,shiftCross(s)?addD(s.date,1):s.date,s.end,[`DESCRIPTION:${icsEsc(shiftHours(s)+' h · '+brl(shiftValue(s)))}`]);
 for(const r of S.series){
  if(r.rule==='odd'||r.rule==='even'){const t0=today();let d=r.start<addD(t0,-60)?addD(t0,-60):r.start;const off=diffD(r.start,d)%7;if(off)d=addD(d,7-off);const lim=r.until?addD(r.until,-1):addD(t0,365);
   for(;d<=lim&&d<=addD(t0,365);d=addD(d,7))if(occurs(r,d)){if(r.time){const [d2,t2]=plus1h(d,r.time);ev(r.id+'-'+d,name(r),d,r.time,d2,t2)}else ev(r.id+'-'+d,name(r),d,'')}
   continue}
  let rule={daily:'FREQ=DAILY',weekly:'FREQ=WEEKLY',biweekly:'FREQ=WEEKLY;INTERVAL=2',monthly:'FREQ=MONTHLY'}[r.rule]||'FREQ=WEEKLY';
  if(r.until)rule+=`;UNTIL=${icsD(addD(r.until,-1))}T235959`;
  const ex=(r.skip||[]).map(d=>r.time?`EXDATE:${icsD(d,r.time)}`:`EXDATE;VALUE=DATE:${icsD(d)}`);
  if(r.time){const [d2,t2]=plus1h(r.start,r.time);ev(r.id,name(r),r.start,r.time,d2,t2,['RRULE:'+rule,...ex])}else ev(r.id,name(r),r.start,'','','',['RRULE:'+rule,...ex]);
 }
 L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n';
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipOne(name,str){
 const enc=new TextEncoder(),d=enc.encode(str),n=enc.encode(name),crc=crc32(d);

 const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,1,true);en.setUint16(10,1,true);en.setUint32(12,cdLen,true);en.setUint32(16,cdOff,true);

}

function moveSugs(from,act,id){
 const t=today();const o=[];
 for(let i=0;i<10&&o.length<5;i++){const ds=addD(t,i);if(ds===from)continue;const c=capacity(ds),l=load(ds);if(c-l>0)o.push(`<button class="sug" data-a="${act}" data-id="${id}" data-ds="${ds}">${dLabel(ds)}<small>cabe${c-l>1?'m':''} ${c-l} · energia ${f1(predict(ds))}</small></button>`)}
 return o.length?`<div class="sugs">${o.join('')}</div>`:'<p class="tiny faint" style="margin:0">Sem dias com folga nos próximos 10 dias.</p>';
}

 addNote:f=>{const v=(D.noteNew||'').trim();if(!v)return;const now=Date.now();S.notes.push({id:nid(),text:v,ts:now,upd:now,pin:false});D.noteNew='';save('notes');toast('Nota salva.')},

 task:f=>{
  const mode=f.dataset.mode,title=$('#tfTitle').value.trim(),type=$('#tfType').value,date=$('#tfDate').value,time=$('#tfTime').value,rec=$('#tfRec')?.value||'none';
  if(!title||!date)return;
  if(mode==='new'){
   if(rec==='none')S.tasks.push({id:nid(),title,type,date,time,done:false,created:Date.now()});
   else S.series.push({id:nid(),title,type,time,start:date,rule:rec,skip:[],done:[]});
   save(rec==='none'?'tasks':'series');closeSheet();
   if(rec==='none'&&type!=='academia'&&type!=='yoga'){memo={};const c=capacity(date),l=load(date);if(l>c)toast(c===0?`${dLabel(date)} não tem espaço previsto. Considere outro dia.`:`${dLabel(date)} passou do limite (${l} de ${c}).`);else toast('Adicionado.')}else toast('Adicionado.');
  }else if(mode==='editTask'){const t=findTask(f.dataset.id);if(!t)return;Object.assign(t,{title,type,date,time});save('tasks');closeSheet()}

  else if(mode==='editOcc'){const r=S.series.find(x=>x.id===f.dataset.id);if(!r)return;r.skip=[...(r.skip||[]),f.dataset.day];S.tasks.push({id:nid(),title,type,date,time,done:(r.done||[]).includes(f.dataset.day),created:Date.now(),fromSeries:r.id});save('series','tasks');closeSheet();toast('Só este dia foi alterado.')}

 aiFit:async()=>{
  const q=(D.aiFitTxt||'').trim();if(!q||!sampleFn)return;
  const ctl=new AbortController();AI.fit={busy:true,text:'',err:'',ctl};FIT=null;render();
  try{
   const r=await sampleFn.json(`${PERSONA}\n\nCONTEXTO:\n${aiContext()}\n\nPEDIDO: encaixar esta atividade: "${q}".\nRegras: só datas dos próximos 14 dias a partir de hoje; nunca em dia de plantão de 10 h ou mais; prefira dia com capacidade livre (capacidade maior que carga) e energia prevista alta; evite a manhã seguinte a plantão noturno; não sobreponha horários de treino ou plantão.\nResponda só com JSON neste formato: {"title":"nome curto da atividade","type":"pessoal|estudo|academia|yoga","options":[{"date":"AAAA-MM-DD","time":"HH:MM ou vazio","reason":"motivo em 1-2 frases"}]} com exatamente 2 opções, a melhor primeiro.`,{signal:ctl.signal});
   const opts=(r&&Array.isArray(r.options)?r.options:[]).filter(o=>o&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)&&o.date>=today()).map(o=>({date:o.date,time:/^\d{2}:\d{2}$/.test(o.time||'')?o.time:'',reason:String(o.reason||'')})).slice(0,2);
   if(!opts.length)throw {code:'invalid_json'};
   FIT={title:String(r.title||q).slice(0,80),type:S.settings.types[r.type]&&r.type!=='plantao'?r.type:'pessoal',options:opts};AI.fit.text='';
  }catch(e){aiFail('fit',e);AI.fit.text=''}
  AI.fit.busy=false;render();
 },
 aiMw:async()=>{
  const txt=(D.aiMwTxt||'').trim();const files=$('#aiMwImg')?.files;
  if(!txt&&!(files&&files.length)){toast('Cole o cronograma ou escolha um print.');return}
  if(!sampleFn)return;
  const ctl=new AbortController();AI.mw={busy:true,text:'',err:'',ctl};MW=null;render();
  try{
   const opt={signal:ctl.signal};if(files&&files.length&&aiImages)opt.images=[...files];
   const r=await sampleFn.json(`Extraia os temas de estudo deste cronograma do cursinho Medway (preparação para residência médica)${opt.images?' (o texto e/ou as imagens anexas)':''}. Mantenha a ordem do cronograma. Cada tema curto (até 60 caracteres), sem datas, sem numeração; junte subtemas da mesma aula num tema só. Ignore itens administrativos. Máximo 60 temas.\nResponda só com JSON: {"themes":["tema 1","tema 2"]}\n\nCRONOGRAMA:\n${txt.slice(0,40000)||'(veja as imagens)'}`,opt);
   const th=(r&&Array.isArray(r.themes)?r.themes:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,60);
   if(!th.length)throw {code:'invalid_json'};
   MW={items:planStudies(th)};AI.mw.text='';
  }catch(e){aiFail('mw',e);AI.mw.text=''}
  AI.mw.busy=false;render();
 },
};

function planStudies(themes){
 memo={};const extra={};let ds=addD(today(),1);const res=[];let guard=0;
 for(const th of themes){
  while(guard<240){const cap=capacity(ds);const st=studiesOn(ds)+(extra[ds]||0);const ld=load(ds)+(extra[ds]||0);const maxS=predict(ds)<2.6?1:2;if(cap>0&&ld<cap&&st<maxS)break;ds=addD(ds,1);guard++}
  res.push({theme:th,date:ds,on:true});extra[ds]=(extra[ds]||0)+1;
 }
 return res;
}
